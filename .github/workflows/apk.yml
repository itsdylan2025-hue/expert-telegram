name: Build Photo Overlay APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Write the app
        run: |
          mkdir -p app/www
          cat > app/www/index.html <<'EOF'
          <!doctype html>
          <html>
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Photo Overlay Studio</title>
          <style>
            *{box-sizing:border-box}
            body{margin:0;font-family:system-ui,sans-serif;background:#111;color:#eee;padding:12px}
            h1{font-size:20px;margin:0 0 10px}
            #stage{position:relative;width:100%;max-width:900px;aspect-ratio:16/10;margin:0 auto 12px;background:#222 repeating-conic-gradient(#2a2a2a 0 25%,#222 0 50%) 0 0/24px 24px;border:2px solid #555;overflow:hidden;touch-action:none}
            #stage img{position:absolute;user-select:none;-webkit-user-drag:none;cursor:grab}
            #stage img.sel{outline:2px dashed #4af}
            #panel{max-width:900px;margin:0 auto}
            button,label.btn{background:#333;color:#eee;border:1px solid #666;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:14px;display:inline-block}
            button:active{background:#555}
            #chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
            .chip.on{background:#4af;color:#000}
            .row{display:flex;align-items:center;gap:8px;margin:8px 0}
            .row span.n{width:90px}
            .row input[type=range]{flex:1}
            .row output{width:50px;text-align:right}
            #pad{display:grid;grid-template-columns:repeat(3,56px);gap:6px;margin:10px 0}
            #pad button{padding:12px 0;font-size:18px}
            #pad .sp{visibility:hidden}
          </style>
          </head>
          <body>
          <h1>Photo Overlay Studio</h1>
          <div id="stage"></div>
          <div id="panel">
            <label class="btn">+ Add photos<input id="file" type="file" accept="image/*" multiple hidden></label>
            <div id="chips"></div>
            <div id="ctl" hidden>
              <div class="row"><span class="n">Size</span><input id="s" type="range" min="2" max="400" step="1"><output id="so"></output></div>
              <div class="row"><span class="n">X (left/right)</span><input id="x" type="range" min="-150" max="250" step="0.5"><output id="xo"></output></div>
              <div class="row"><span class="n">Y (up/down)</span><input id="y" type="range" min="-150" max="250" step="0.5"><output id="yo"></output></div>
              <div class="row"><span class="n">Rotate</span><input id="r" type="range" min="-180" max="180" step="1"><output id="ro"></output></div>
              <div class="row"><span class="n">Opacity</span><input id="o" type="range" min="0" max="100" step="1"><output id="oo"></output></div>
              <div id="pad">
                <span class="sp"></span><button data-d="0,-1">&#9650;</button><span class="sp"></span>
                <button data-d="-1,0">&#9664;</button><button data-d="0,1">&#9660;</button><button data-d="1,0">&#9654;</button>
              </div>
              <button id="front">Bring to front</button>
              <button id="back">Send to back</button>
              <button id="del">Delete</button>
            </div>
          </div>
          <script>
          const stage=document.getElementById('stage'),chips=document.getElementById('chips'),ctl=document.getElementById('ctl');
          const $=id=>document.getElementById(id);
          let layers=[],cur=null,z=1;
          function apply(l){
            const e=l.el;
            e.style.left=l.x+'%';e.style.top=l.y+'%';e.style.width=l.s+'%';
            e.style.opacity=l.o/100;
            e.style.transform='translate(-50%,-50%) rotate('+l.r+'deg)';
            e.style.zIndex=l.z;
            e.classList.toggle('sel',l===cur);
          }
          function refresh(){
            chips.innerHTML='';
            layers.forEach((l,i)=>{
              const b=document.createElement('button');
              b.className='chip'+(l===cur?' on':'');
              b.textContent=(i+1)+'. '+l.name.slice(0,14);
              b.onclick=()=>select(l);
              chips.appendChild(b);
            });
            ctl.hidden=!cur;
            if(cur){
              [['s','s'],['x','x'],['y','y'],['r','r'],['o','o']].forEach(([k,p])=>{
                $(k).value=cur[p];$(k+'o').textContent=cur[p];
              });
            }
            layers.forEach(apply);
          }
          function select(l){cur=l;refresh();}
          $('file').onchange=e=>{
            [...e.target.files].forEach(f=>{
              const img=document.createElement('img');
              img.src=URL.createObjectURL(f);
              img.draggable=false;
              const l={name:f.name,el:img,x:50,y:50,s:40,r:0,o:100,z:z++};
              layers.push(l);stage.appendChild(img);
              img.addEventListener('pointerdown',ev=>{
                ev.preventDefault();select(l);
                const rect=stage.getBoundingClientRect();
                const sx=ev.clientX,sy=ev.clientY,ox=l.x,oy=l.y;
                img.setPointerCapture(ev.pointerId);
                const mv=m=>{
                  l.x=Math.round((ox+(m.clientX-sx)/rect.width*100)*2)/2;
                  l.y=Math.round((oy+(m.clientY-sy)/rect.height*100)*2)/2;
                  refresh();
                };
                const up=()=>{img.removeEventListener('pointermove',mv);img.removeEventListener('pointerup',up);};
                img.addEventListener('pointermove',mv);img.addEventListener('pointerup',up);
              });
              select(l);
            });
            e.target.value='';
          };
          ['s','x','y','r','o'].forEach(k=>{
            $(k).oninput=()=>{if(cur){cur[k]=parseFloat($(k).value);refresh();}};
          });
          document.querySelectorAll('#pad button').forEach(b=>{
            b.onclick=()=>{
              if(!cur)return;
              const [dx,dy]=b.dataset.d.split(',').map(Number);
              cur.x+=dx;cur.y+=dy;refresh();
            };
          });
          $('front').onclick=()=>{if(cur){cur.z=z++;refresh();}};
          $('back').onclick=()=>{if(cur){cur.z=Math.min(...layers.map(l=>l.z))-1;refresh();}};
          $('del').onclick=()=>{
            if(!cur)return;
            cur.el.remove();layers=layers.filter(l=>l!==cur);
            cur=layers[layers.length-1]||null;refresh();
          };
          </script>
          </body>
          </html>
          EOF
          test -s app/www/index.html

      - name: Create Android project
        working-directory: app
        run: |
          cat > package.json <<'EOF'
          {
            "name": "photo-overlay-studio",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "6.2.0",
              "@capacitor/cli": "6.2.0",
              "@capacitor/core": "6.2.0"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.photooverlay.studio",
            "appName": "Photo Overlay Studio",
            "webDir": "www"
          }
          EOF
          npm install
          npx cap add android
          npx cap sync android

      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > app/android/local.properties

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk PhotoOverlayStudio.apk

      - name: Save as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoOverlayStudio
          path: PhotoOverlayStudio.apk

      - name: Publish to Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}-${{ github.run_attempt }}" PhotoOverlayStudio.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Photo Overlay Studio v${{ github.run_number }}" \
            --notes "Debug APK. Download and install on Android."
