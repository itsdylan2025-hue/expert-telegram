name: Build Photo Overlay APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/www
          echo '<!doctype html><html><body>overlay</body></html>' > app/www/index.html
          cd app
          cat > package.json <<'EOF'
          {
            "name": "photo-overlay-studio",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "6.2.0",
              "@capacitor/cli": "6.2.0",
              "@capacitor/core": "6.2.0"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.photooverlay.studio",
            "appName": "Photo Overlay Studio",
            "webDir": "www"
          }
          EOF
          npm install
          npx cap add android
          npx cap sync android

      - name: Write native manifest
        run: |
          cat > app/android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Photo Overlay Studio"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="photo_overlay"/>
                  </service>
              </application>
          </manifest>
          EOF

      - name: Write Store.java
        run: |
          mkdir -p app/android/app/src/main/java/com/photooverlay/studio
          cat > app/android/app/src/main/java/com/photooverlay/studio/Store.java <<'EOF'
          package com.photooverlay.studio;

          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Matrix;
          import android.media.ExifInterface;
          import android.net.Uri;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.List;

          public class Store {
            public static class Layer {
              public String file, name;
              public boolean on = true;
              public int size = 40, x = 50, y = 50, op = 100;
              public Bitmap bmp;
            }

            public static final List<Layer> layers = new ArrayList<>();
            public static boolean running = false;
            private static boolean loaded = false;

            public static synchronized void load(Context c) {
              if (loaded) return;
              loaded = true;
              try {
                String s = c.getSharedPreferences("p", 0).getString("layers", "[]");
                JSONArray a = new JSONArray(s);
                for (int i = 0; i < a.length(); i++) {
                  JSONObject o = a.getJSONObject(i);
                  Layer l = new Layer();
                  l.file = o.getString("file");
                  l.name = o.optString("name", "Photo");
                  l.on = o.optBoolean("on", true);
                  l.size = o.optInt("size", 40);
                  l.x = o.optInt("x", 50);
                  l.y = o.optInt("y", 50);
                  l.op = o.optInt("op", 100);
                  l.bmp = BitmapFactory.decodeFile(new File(c.getFilesDir(), l.file).getAbsolutePath());
                  if (l.bmp != null) layers.add(l);
                }
              } catch (Exception e) {
              }
            }

            public static synchronized void save(Context c) {
              try {
                JSONArray a = new JSONArray();
                for (Layer l : layers) {
                  JSONObject o = new JSONObject();
                  o.put("file", l.file);
                  o.put("name", l.name);
                  o.put("on", l.on);
                  o.put("size", l.size);
                  o.put("x", l.x);
                  o.put("y", l.y);
                  o.put("op", l.op);
                  a.put(o);
                }
                c.getSharedPreferences("p", 0).edit().putString("layers", a.toString()).apply();
              } catch (Exception e) {
              }
            }

            public static Layer decode(Context c, Uri uri, String name) throws Exception {
              File tmp = new File(c.getCacheDir(), "tmp.bin");
              InputStream in = c.getContentResolver().openInputStream(uri);
              OutputStream os = new FileOutputStream(tmp);
              byte[] buf = new byte[65536];
              int n;
              while ((n = in.read(buf)) > 0) os.write(buf, 0, n);
              os.close();
              in.close();
              BitmapFactory.Options o = new BitmapFactory.Options();
              o.inJustDecodeBounds = true;
              BitmapFactory.decodeFile(tmp.getAbsolutePath(), o);
              int max = Math.max(o.outWidth, o.outHeight);
              int ss = 1;
              while (max / ss > 1600) ss *= 2;
              o = new BitmapFactory.Options();
              o.inSampleSize = ss;
              Bitmap b = BitmapFactory.decodeFile(tmp.getAbsolutePath(), o);
              if (b == null) throw new Exception("decode failed");
              int deg = 0;
              try {
                int ori = new ExifInterface(tmp.getAbsolutePath()).getAttributeInt(ExifInterface.TAG_ORIENTATION, 1);
                if (ori == 6) deg = 90;
                else if (ori == 3) deg = 180;
                else if (ori == 8) deg = 270;
              } catch (Exception e) {
              }
              if (deg != 0) {
                Matrix m = new Matrix();
                m.postRotate(deg);
                b = Bitmap.createBitmap(b, 0, 0, b.getWidth(), b.getHeight(), m, true);
              }
              String f = "p" + System.nanoTime() + ".img";
              FileOutputStream fo = new FileOutputStream(new File(c.getFilesDir(), f));
              b.compress(b.hasAlpha() ? Bitmap.CompressFormat.PNG : Bitmap.CompressFormat.JPEG, 92, fo);
              fo.close();
              tmp.delete();
              Layer l = new Layer();
              l.file = f;
              l.name = name;
              l.bmp = b;
              return l;
            }

            public static void remove(Context c, Layer l) {
              layers.remove(l);
              new File(c.getFilesDir(), l.file).delete();
              save(c);
            }
          }
          EOF

      - name: Write OverlayService.java
        run: |
          cat > app/android/app/src/main/java/com/photooverlay/studio/OverlayService.java <<'EOF'
          package com.photooverlay.studio;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.content.res.Configuration;
          import android.graphics.PixelFormat;
          import android.os.Build;
          import android.os.IBinder;
          import android.util.DisplayMetrics;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.ImageView;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.Map;

          public class OverlayService extends Service {
            static OverlayService inst;
            WindowManager wm;
            final Map<Store.Layer, ImageView> views = new HashMap<>();

            public static void refresh() {
              if (inst != null) inst.sync();
            }

            @Override
            public IBinder onBind(Intent i) {
              return null;
            }

            @Override
            public void onCreate() {
              super.onCreate();
              wm = (WindowManager) getSystemService(WINDOW_SERVICE);
              inst = this;
            }

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
              startFg();
              Store.load(this);
              Store.running = true;
              sync();
              return START_STICKY;
            }

            void startFg() {
              String ch = "overlay";
              if (Build.VERSION.SDK_INT >= 26) {
                NotificationManager nm = getSystemService(NotificationManager.class);
                nm.createNotificationChannel(new NotificationChannel(ch, "Overlay", NotificationManager.IMPORTANCE_LOW));
              }
              Intent oi = new Intent(this, MainActivity.class);
              PendingIntent pi = PendingIntent.getActivity(this, 0, oi, PendingIntent.FLAG_IMMUTABLE);
              Notification.Builder b = Build.VERSION.SDK_INT >= 26
                  ? new Notification.Builder(this, ch)
                  : new Notification.Builder(this);
              Notification n = b.setContentTitle("Photo overlay is on")
                  .setContentText("Tap to edit. Press STOP in the app to remove it.")
                  .setSmallIcon(android.R.drawable.ic_menu_gallery)
                  .setContentIntent(pi)
                  .setOngoing(true)
                  .build();
              if (Build.VERSION.SDK_INT >= 34) {
                startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
              } else {
                startForeground(1, n);
              }
            }

            void sync() {
              if (wm == null) return;
              for (Store.Layer k : new ArrayList<>(views.keySet())) {
                if (!Store.layers.contains(k)) {
                  try {
                    wm.removeView(views.get(k));
                  } catch (Exception e) {
                  }
                  views.remove(k);
                }
              }
              DisplayMetrics dm = new DisplayMetrics();
              wm.getDefaultDisplay().getRealMetrics(dm);
              for (Store.Layer l : Store.layers) {
                if (l.bmp == null) continue;
                int w = Math.max(4, (int) (dm.widthPixels * l.size / 100f));
                int h = Math.max(4, (int) (w * (float) l.bmp.getHeight() / l.bmp.getWidth()));
                WindowManager.LayoutParams p = new WindowManager.LayoutParams(
                    w, h,
                    Build.VERSION.SDK_INT >= 26
                        ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                        : WindowManager.LayoutParams.TYPE_PHONE,
                    WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                        | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                        | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                        | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                    PixelFormat.TRANSLUCENT);
                p.gravity = Gravity.TOP | Gravity.LEFT;
                p.x = (int) (dm.widthPixels * l.x / 100f - w / 2f);
                p.y = (int) (dm.heightPixels * l.y / 100f - h / 2f);
                p.alpha = l.op / 100f;
                ImageView iv = views.get(l);
                try {
                  if (iv == null) {
                    iv = new ImageView(this);
                    iv.setScaleType(ImageView.ScaleType.FIT_XY);
                    iv.setImageBitmap(l.bmp);
                    iv.setVisibility(l.on ? View.VISIBLE : View.INVISIBLE);
                    wm.addView(iv, p);
                    views.put(l, iv);
                  } else {
                    iv.setVisibility(l.on ? View.VISIBLE : View.INVISIBLE);
                    wm.updateViewLayout(iv, p);
                  }
                } catch (Exception e) {
                }
              }
            }

            @Override
            public void onConfigurationChanged(Configuration c) {
              super.onConfigurationChanged(c);
              sync();
            }

            @Override
            public void onDestroy() {
              for (ImageView v : views.values()) {
                try {
                  wm.removeView(v);
                } catch (Exception e) {
                }
              }
              views.clear();
              inst = null;
              Store.running = false;
              super.onDestroy();
            }
          }
          EOF

      - name: Write MainActivity.java
        run: |
          cat > app/android/app/src/main/java/com/photooverlay/studio/MainActivity.java <<'EOF'
          package com.photooverlay.studio;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {
            Store.Layer cur;
            LinearLayout list, ctl;
            TextView status;
            Button startBtn, allBtn, onBtn;
            final List<Sl> sliders = new ArrayList<>();

            interface IntSet { void set(Store.Layer l, int v); }
            interface IntGet { int get(Store.Layer l); }

            int dp(int v) {
              return (int) (v * getResources().getDisplayMetrics().density);
            }

            Button btn(String t, View.OnClickListener c) {
              Button b = new Button(this);
              b.setText(t);
              b.setAllCaps(false);
              b.setTextColor(Color.WHITE);
              b.setBackgroundColor(Color.rgb(51, 51, 51));
              b.setOnClickListener(c);
              LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                  ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
              lp.setMargins(0, dp(4), 0, dp(4));
              b.setLayoutParams(lp);
              return b;
            }

            TextView tv(String t, int size) {
              TextView v = new TextView(this);
              v.setText(t);
              v.setTextSize(size);
              v.setTextColor(Color.WHITE);
              return v;
            }

            class Sl {
              SeekBar bar = new SeekBar(MainActivity.this);
              TextView val = tv("", 14);
              int min;
              IntGet g;

              Sl(LinearLayout parent, String label, int min, int max, IntGet g, final IntSet st) {
                this.min = min;
                this.g = g;
                final int mn = min;
                LinearLayout row = new LinearLayout(MainActivity.this);
                row.setOrientation(LinearLayout.HORIZONTAL);
                row.setGravity(Gravity.CENTER_VERTICAL);
                TextView t = tv(label, 14);
                t.setWidth(dp(90));
                bar.setMax(max - min);
                val.setWidth(dp(50));
                val.setGravity(Gravity.RIGHT);
                row.addView(t);
                row.addView(bar, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1));
                row.addView(val);
                parent.addView(row);
                bar.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                  public void onProgressChanged(SeekBar b, int p, boolean u) {
                    if (u && cur != null) {
                      st.set(cur, p + mn);
                      val.setText("" + (p + mn));
                      changed();
                    }
                  }
                  public void onStartTrackingTouch(SeekBar b) {}
                  public void onStopTrackingTouch(SeekBar b) {}
                });
                sliders.add(this);
              }

              void show() {
                if (cur != null) {
                  bar.setProgress(g.get(cur) - min);
                  val.setText("" + g.get(cur));
                }
              }
            }

            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              Store.load(this);
              if (Build.VERSION.SDK_INT >= 33) {
                requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1);
              }
              ScrollView sv = new ScrollView(this);
              sv.setBackgroundColor(Color.rgb(17, 17, 17));
              LinearLayout root = new LinearLayout(this);
              root.setOrientation(LinearLayout.VERTICAL);
              root.setPadding(dp(14), dp(40), dp(14), dp(40));
              sv.addView(root);

              root.addView(tv("Photo Overlay Studio", 22));
              status = tv("", 13);
              status.setPadding(0, dp(6), 0, dp(6));
              root.addView(status);

              root.addView(btn("1. Allow display over other apps", v -> {
                Intent i = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                    Uri.parse("package:" + getPackageName()));
                startActivity(i);
              }));
              root.addView(btn("2. Add photos", v -> {
                Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                i.setType("image/*");
                i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                startActivityForResult(Intent.createChooser(i, "Pick photos"), 7);
              }));
              startBtn = btn("3. START overlay", v -> toggleOverlay());
              root.addView(startBtn);
              allBtn = btn("Hide all photos", v -> {
                boolean any = false;
                for (Store.Layer l : Store.layers) if (l.on) any = true;
                for (Store.Layer l : Store.layers) l.on = !any;
                rebuild();
              });
              root.addView(allBtn);

              list = new LinearLayout(this);
              list.setOrientation(LinearLayout.VERTICAL);
              root.addView(list);

              ctl = new LinearLayout(this);
              ctl.setOrientation(LinearLayout.VERTICAL);
              ctl.setVisibility(View.GONE);
              root.addView(ctl);

              onBtn = btn("Photo: ON", v -> {
                if (cur != null) {
                  cur.on = !cur.on;
                  rebuild();
                }
              });
              ctl.addView(onBtn);
              new Sl(ctl, "Size", 2, 300, l -> l.size, (l, x) -> l.size = x);
              new Sl(ctl, "X left/right", -150, 250, l -> l.x, (l, x) -> l.x = x);
              new Sl(ctl, "Y up/down", -150, 250, l -> l.y, (l, x) -> l.y = x);
              new Sl(ctl, "Opacity", 5, 100, l -> l.op, (l, x) -> l.op = x);

              LinearLayout r1 = new LinearLayout(this);
              r1.setOrientation(LinearLayout.HORIZONTAL);
              r1.addView(spacer());
              r1.addView(arrow("\u25B2", 0, -1));
              r1.addView(spacer());
              LinearLayout r2 = new LinearLayout(this);
              r2.setOrientation(LinearLayout.HORIZONTAL);
              r2.addView(arrow("\u25C0", -1, 0));
              r2.addView(arrow("\u25BC", 0, 1));
              r2.addView(arrow("\u25B6", 1, 0));
              ctl.addView(r1);
              ctl.addView(r2);

              ctl.addView(btn("Bring to front", v -> {
                if (cur != null) {
                  Store.layers.remove(cur);
                  Store.layers.add(cur);
                  rebuild();
                }
              }));
              ctl.addView(btn("Send to back", v -> {
                if (cur != null) {
                  Store.layers.remove(cur);
                  Store.layers.add(0, cur);
                  rebuild();
                }
              }));
              ctl.addView(btn("Delete photo", v -> {
                if (cur != null) {
                  Store.remove(this, cur);
                  cur = Store.layers.isEmpty() ? null : Store.layers.get(Store.layers.size() - 1);
                  rebuild();
                }
              }));

              setContentView(sv);
              if (!Store.layers.isEmpty()) cur = Store.layers.get(Store.layers.size() - 1);
              rebuild();
            }

            View spacer() {
              View s = new View(this);
              s.setLayoutParams(new LinearLayout.LayoutParams(0, 1, 1));
              return s;
            }

            Button arrow(String t, final int dx, final int dy) {
              Button b = btn(t, v -> {
                if (cur != null) {
                  cur.x += dx;
                  cur.y += dy;
                  rebuild();
                }
              });
              b.setLayoutParams(new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1));
              return b;
            }

            void toggleOverlay() {
              if (Store.running) {
                stopService(new Intent(this, OverlayService.class));
                Store.running = false;
              } else {
                if (Build.VERSION.SDK_INT >= 23 && !Settings.canDrawOverlays(this)) {
                  Toast.makeText(this, "Tap button 1 and allow display over other apps", Toast.LENGTH_LONG).show();
                  return;
                }
                if (Store.layers.isEmpty()) {
                  Toast.makeText(this, "Add photos first", Toast.LENGTH_LONG).show();
                  return;
                }
                Intent si = new Intent(this, OverlayService.class);
                if (Build.VERSION.SDK_INT >= 26) startForegroundService(si);
                else startService(si);
                Store.running = true;
              }
              updateStatus();
            }

            void changed() {
              Store.save(this);
              OverlayService.refresh();
            }

            void rebuild() {
              list.removeAllViews();
              for (int i = 0; i < Store.layers.size(); i++) {
                final Store.Layer l = Store.layers.get(i);
                LinearLayout r = new LinearLayout(this);
                r.setOrientation(LinearLayout.HORIZONTAL);
                Button eye = btn(l.on ? "ON" : "OFF", v -> {
                  l.on = !l.on;
                  rebuild();
                });
                eye.setBackgroundColor(l.on ? Color.rgb(34, 170, 119) : Color.rgb(85, 34, 34));
                eye.setLayoutParams(new LinearLayout.LayoutParams(dp(70), ViewGroup.LayoutParams.WRAP_CONTENT));
                Button nm = btn((i + 1) + ". " + l.name, v -> {
                  cur = l;
                  rebuild();
                });
                nm.setBackgroundColor(l == cur ? Color.rgb(68, 170, 255) : Color.rgb(51, 51, 51));
                nm.setTextColor(l == cur ? Color.BLACK : Color.WHITE);
                nm.setLayoutParams(new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1));
                r.addView(eye);
                r.addView(nm);
                list.addView(r);
              }
              ctl.setVisibility(cur == null ? View.GONE : View.VISIBLE);
              if (cur != null) {
                onBtn.setText(cur.on ? "Photo: ON (tap to hide)" : "Photo: OFF (tap to show)");
                onBtn.setBackgroundColor(cur.on ? Color.rgb(34, 170, 119) : Color.rgb(85, 34, 34));
                for (Sl s : sliders) s.show();
              }
              boolean any = false;
              for (Store.Layer l : Store.layers) if (l.on) any = true;
              allBtn.setText(any ? "Hide all photos" : "Show all photos");
              changed();
              updateStatus();
            }

            void updateStatus() {
              boolean ok = Build.VERSION.SDK_INT < 23 || Settings.canDrawOverlays(this);
              status.setText("Permission: " + (ok ? "OK" : "NOT GRANTED (tap button 1)")
                  + "\nOverlay: " + (Store.running ? "ON (stays after you close the app)" : "OFF")
                  + "\nPhotos: " + Store.layers.size());
              startBtn.setText(Store.running ? "3. STOP overlay" : "3. START overlay");
              startBtn.setBackgroundColor(Store.running ? Color.rgb(170, 51, 51) : Color.rgb(34, 136, 68));
            }

            @Override
            protected void onResume() {
              super.onResume();
              updateStatus();
            }

            @Override
            protected void onActivityResult(int req, int res, final Intent data) {
              super.onActivityResult(req, res, data);
              if (req != 7 || res != RESULT_OK || data == null) return;
              final List<Uri> uris = new ArrayList<>();
              ClipData cd = data.getClipData();
              if (cd != null) {
                for (int i = 0; i < cd.getItemCount(); i++) uris.add(cd.getItemAt(i).getUri());
              } else if (data.getData() != null) {
                uris.add(data.getData());
              }
              Toast.makeText(this, "Loading " + uris.size() + " photo(s)...", Toast.LENGTH_SHORT).show();
              new Thread(() -> {
                for (final Uri u : uris) {
                  try {
                    final Store.Layer l = Store.decode(this, u, "Photo " + (Store.layers.size() + 1));
                    runOnUiThread(() -> {
                      l.name = "Photo " + (Store.layers.size() + 1);
                      Store.layers.add(l);
                      cur = l;
                      rebuild();
                    });
                    Thread.sleep(150);
                  } catch (Exception e) {
                    runOnUiThread(() -> Toast.makeText(this, "Could not load a photo", Toast.LENGTH_LONG).show());
                  }
                }
              }).start();
            }
          }
          EOF

      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > app/android/local.properties

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk PhotoOverlayStudio.apk

      - name: Save as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoOverlayStudio
          path: PhotoOverlayStudio.apk

      - name: Publish to Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}-${{ github.run_attempt }}" PhotoOverlayStudio.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
